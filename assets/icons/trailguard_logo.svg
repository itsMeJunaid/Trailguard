<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- shield background with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D6A4F"/>
      <stop offset="1" stop-color="#0F5238"/>
    </linearGradient>
    <linearGradient id="peakRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#95D4B3"/>
      <stop offset="1" stop-color="#40916C"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C6F2DA"/>
    </linearGradient>
  </defs>

  <!-- shield shape -->
  <path d="M100 8 L182 34 L182 120 C182 170 145 202 100 212 C55 202 18 170 18 120 L18 34 Z"
        fill="url(#bg)" stroke="#0F5238" stroke-width="3"/>

  <!-- subtle inner highlight -->
  <path d="M100 16 L172 40 L172 118 C172 162 140 191 100 200 C60 191 28 162 28 118 L28 40 Z"
        fill="none" stroke="#95D4B3" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- circuit trace lines (background) -->
  <g stroke="#95D4B3" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M30 70 L52 70 L60 78"/>
    <path d="M52 70 L52 90"/>
    <circle cx="52" cy="90" r="2" fill="#95D4B3" fill-opacity="0.75"/>
    <path d="M28 130 L44 130 L50 136 L50 154"/>
    <circle cx="50" cy="154" r="2" fill="#95D4B3" fill-opacity="0.75"/>
    <path d="M170 90 L150 90 L144 96"/>
    <circle cx="144" cy="96" r="2" fill="#95D4B3" fill-opacity="0.75"/>
    <path d="M170 150 L156 150 L150 156 L150 172"/>
    <circle cx="150" cy="172" r="2" fill="#95D4B3" fill-opacity="0.75"/>
    <path d="M30 170 L46 170"/>
    <circle cx="46" cy="170" r="2" fill="#95D4B3" fill-opacity="0.75"/>
  </g>

  <!-- left mountain (darker) -->
  <path d="M40 170 L85 88 L112 134 L128 114 L164 170 Z"
        fill="#1B4332"/>

  <!-- right peak highlight -->
  <path d="M128 114 L164 170 L144 170 L128 140 Z"
        fill="url(#peakRight)"/>

  <!-- front peak with snowcap -->
  <path d="M75 170 L98 108 L120 170 Z"
        fill="#2D6A4F"/>
  <path d="M94 118 L98 108 L104 122 L100 120 Z"
        fill="#E8FFF0"/>

  <!-- winding river / trail -->
  <path d="M100 120
           C 96 132, 108 140, 104 152
           C 100 162, 112 172, 108 184
           C 106 194, 110 200, 106 206"
        stroke="url(#river)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M100 120
           C 96 132, 108 140, 104 152
           C 100 162, 112 172, 108 184
           C 106 194, 110 200, 106 206"
        stroke="#B1F0CE" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- small trail nodes -->
  <circle cx="104" cy="152" r="2.4" fill="#0F5238"/>
  <circle cx="108" cy="184" r="2.4" fill="#0F5238"/>
</svg>
